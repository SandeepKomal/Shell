name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: ShellCheck (the production scripts and their tests)
        run: shellcheck scripts/retry.sh scripts/wait_for.sh scripts/ssl_cert_expiry.sh scripts/backup_rotate.sh scripts/release_deploy.sh scripts/incident_snapshot.sh scripts/deleted_open_files.sh scripts/user_access_audit.sh scripts/git_prune_branches.sh scripts/preflight_check.sh scripts/ec2_by_tag.sh scripts/s3_backup_sync.sh scripts/ecr_cleanup.sh scripts/pg_backup.sh scripts/mysql_backup.sh scripts/k8s_rollout.sh scripts/k8s_node_drain.sh scripts/k8s_collect_logs.sh scripts/with_lock.sh scripts/multi_host_run.sh scripts/patch_report.sh scripts/nginx_safe_reload.sh scripts/journal_errors.sh scripts/terraform_drift_check.sh scripts/pii_scan.sh scripts/pii_redact.sh scripts/retention_cleanup.sh scripts/breach_evidence.sh tests/test_scripts.sh
      - name: Run the scripts against throwaway directories
        run: tests/test_scripts.sh
      - name: No personal data in the repository (synthetic test values are allowlisted in .piiallow)
        run: scripts/pii_scan.sh -c -a .piiallow .

  site:
    name: DevOps Nimbus site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Site scripts parse
        run: for f in site/*.js tools/*.js tests/*.js; do node --check "$f"; done
      - name: Content, links, cheat sheet Try rows and problems.html
        run: node tests/check_site_data.js
      - name: Playground scenarios start broken, wrong moves fail, fixes work
        run: node tests/check_playground.js
      - name: The playground's bash matches real bash
        run: bash --version | head -1 && node tests/check_bash_parity.js
      - name: Script X-ray rules
        run: node tests/check_xray.js
      - name: Fuzz the playground
        run: node tests/fuzz_playground.js 3000
