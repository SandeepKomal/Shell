name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ShellCheck (the new scripts and their tests)
        run: shellcheck scripts/retry.sh scripts/wait_for.sh scripts/ssl_cert_expiry.sh scripts/backup_rotate.sh scripts/release_deploy.sh scripts/incident_snapshot.sh scripts/deleted_open_files.sh scripts/user_access_audit.sh scripts/git_prune_branches.sh scripts/preflight_check.sh tests/test_scripts.sh
      - name: Run the scripts against throwaway directories
        run: tests/test_scripts.sh

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile
        run: python3 -m py_compile python/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s python/tests -v
      - name: No secrets committed
        run: python3 python/secret_scanner.py .
